[project]
name = "financial-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bala-saravanan02", email = "bala02saravanan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14",
    "sentence-transformers>=5.7.0",
    "tabulate>=0.10.0",
]

[project.scripts]
financial-rag = "financial_rag:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
